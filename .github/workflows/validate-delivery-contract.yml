name: Validate delivery contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile workspace tools
        run: >-
          python3 -m py_compile
          scripts/validate_delivery_contract.py
          scripts/init_project_workspace.py
      - name: Validate canonical project Wiki contract
        run: python3 scripts/validate_delivery_contract.py
      - name: Initialize and validate a project workspace
        run: |
          tmp_root="$(mktemp -d)"
          python3 scripts/init_project_workspace.py ci-learning-project \
            --title "CI Learning Project" \
            --workspace-root "$tmp_root"
          python3 scripts/validate_delivery_contract.py \
            --project-dir "$tmp_root/ci-learning-project"
      - name: Validate checked-in legacy S1/S2 run
        run: >-
          python3 scripts/validate_delivery_contract.py
          --legacy-run-dir workspace/senior-teaching-researcher/runs/run-20260727-234421
      - name: Parse all JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('all JSON files parsed')
          PY
