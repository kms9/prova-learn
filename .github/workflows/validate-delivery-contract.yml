name: Validate delivery contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical stage delivery contract
        run: python3 scripts/validate_delivery_contract.py
      - name: Validate checked-in S1/S2 example run
        run: >-
          python3 scripts/validate_delivery_contract.py
          --run-dir workspace/senior-teaching-researcher/runs/run-20260727-234421
      - name: Parse all JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('all JSON files parsed')
          PY
