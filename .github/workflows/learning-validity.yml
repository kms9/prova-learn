name: learning-validity

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('.').rglob('*.jsonl'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip():
                      try:
                          json.loads(line)
                      except json.JSONDecodeError as exc:
                          raise SystemExit(f'{path}:{number}: {exc}')
          print('JSON/JSONL PASS')
          PY

      - name: Compile validation scripts
        run: |
          python3 -m py_compile scripts/validate_delivery_contract.py

      - name: Validate repository contracts
        run: |
          python3 scripts/validate_delivery_contract.py

      - name: Validate FDE example project
        run: |
          python3 scripts/validate_delivery_contract.py \
            --project-dir workspace/forward-deployed-engineer

      - name: Check whitespace
        run: git diff --check origin/main...HEAD
