<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S7 · 掌握验证与重规划</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14231d;
      --muted: #66766f;
      --paper: #f4f1e9;
      --surface: rgba(255, 255, 252, 0.9);
      --surface-strong: #fffef9;
      --line: #d9ded8;
      --accent: #1f7656;
      --accent-soft: #dceee5;
      --accent-deep: #0c4f38;
      --warn: #a25d17;
      --danger: #a1403e;
      --shadow: 0 18px 50px rgba(28, 47, 39, 0.1);
      --radius: 22px;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 0%, color-mix(in srgb, var(--accent-soft) 80%, transparent), transparent 29rem),
        radial-gradient(circle at 96% 20%, rgba(255, 255, 255, 0.92), transparent 25rem),
        var(--paper);
    }

    button, input { font: inherit; }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 65%, white);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 20;
      left: 1rem;
      top: -4rem;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      color: white;
      background: var(--accent-deep);
    }

    .skip-link:focus { top: 1rem; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page {
      width: min(1440px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1rem 0 4rem;
    }

    .masthead {
      position: relative;
      overflow: hidden;
      min-height: 300px;
      padding: clamp(1.5rem, 4vw, 4rem);
      border-radius: 32px;
      color: white;
      background:
        linear-gradient(118deg, var(--accent-deep), var(--accent) 68%, color-mix(in srgb, var(--accent) 72%, #dca24a));
      box-shadow: var(--shadow);
    }

    .masthead::before,
    .masthead::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
    }

    .masthead::before { width: 26rem; height: 26rem; right: -8rem; top: -15rem; }
    .masthead::after { width: 15rem; height: 15rem; right: 9rem; bottom: -12rem; }

    .masthead-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, 0.65fr);
      gap: 2rem;
      align-items: end;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    h1 {
      max-width: 920px;
      margin: 0;
      font-family: "Iowan Old Style", "Songti SC", serif;
      font-size: clamp(2.25rem, 5.2vw, 5rem);
      font-weight: 650;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .lede {
      max-width: 760px;
      margin: 1.15rem 0 0;
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      line-height: 1.75;
      opacity: 0.88;
    }

    .decision-card {
      padding: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 20px;
      background: rgba(6, 31, 22, 0.22);
      backdrop-filter: blur(8px);
    }

    .decision-label {
      margin: 0 0 0.45rem;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
    }

    .decision-value {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 780;
    }

    .decision-route {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 1rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .decision-route strong {
      display: inline-grid;
      place-items: center;
      min-width: 2.6rem;
      height: 2rem;
      padding: 0 0.65rem;
      border-radius: 999px;
      color: var(--accent-deep);
      background: white;
    }

    .metrics {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin: -1.4rem clamp(1rem, 4vw, 3.5rem) 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--line);
      box-shadow: var(--shadow);
    }

    .metric {
      min-height: 108px;
      padding: 1.1rem 1.25rem;
      background: var(--surface-strong);
    }

    .metric-label {
      display: block;
      margin-bottom: 0.45rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .metric-value {
      display: block;
      font-size: clamp(1.1rem, 2vw, 1.55rem);
      font-weight: 780;
      line-height: 1.28;
    }

    .workspace {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 1.5rem;
      margin-top: 2.2rem;
    }

    .rail {
      position: sticky;
      top: 1rem;
      align-self: start;
      padding: 0.9rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(28, 47, 39, 0.06);
      backdrop-filter: blur(14px);
    }

    .rail-title {
      margin: 0.35rem 0.55rem 0.85rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 780;
      letter-spacing: 0.1em;
    }

    .tabs { display: grid; gap: 0.45rem; }

    .tab {
      width: 100%;
      padding: 0.9rem 0.95rem;
      border: 0;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: var(--accent-deep);
      background: var(--accent-soft);
      font-weight: 780;
    }

    .rail-note {
      margin: 1rem 0.55rem 0.35rem;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.65;
    }

    .main-column { min-width: 0; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .view-heading h2 {
      margin: 0;
      font-family: "Iowan Old Style", "Songti SC", serif;
      font-size: clamp(1.8rem, 3vw, 2.75rem);
      letter-spacing: -0.025em;
    }

    .view-heading p {
      margin: 0.4rem 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .search {
      width: min(320px, 42vw);
      padding: 0.78rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface-strong);
    }

    .content-stack { display: grid; gap: 1.25rem; }

    .section {
      padding: clamp(1.1rem, 2.5vw, 1.75rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 12px 34px rgba(31, 49, 41, 0.055);
      backdrop-filter: blur(10px);
    }

    .section-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .section h3 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: -0.01em;
    }

    .section-description {
      margin: 0.3rem 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .count {
      flex: 0 0 auto;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      color: var(--accent-deep);
      background: var(--accent-soft);
      font-size: 0.76rem;
      font-weight: 780;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 0.85rem;
    }

    .card {
      display: flex;
      min-height: 158px;
      flex-direction: column;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface-strong);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
      box-shadow: 0 10px 20px rgba(31, 49, 41, 0.07);
    }

    .card-kicker {
      margin: 0 0 0.45rem;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .card h4 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.45;
    }

    .card p {
      margin: 0.55rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    .card-action {
      align-self: start;
      margin-top: auto;
      padding: 0.55rem 0 0;
      border: 0;
      color: var(--accent-deep);
      background: transparent;
      font-weight: 780;
      cursor: pointer;
    }

    .fact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.8rem;
    }

    .fact {
      padding: 1rem;
      border-left: 4px solid var(--accent);
      border-radius: 8px 16px 16px 8px;
      background: color-mix(in srgb, var(--accent-soft) 55%, white);
    }

    .fact-label {
      display: block;
      margin-bottom: 0.45rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 780;
    }

    .fact-value {
      display: block;
      font-weight: 700;
      line-height: 1.55;
    }

    .bullet-list {
      display: grid;
      gap: 0.65rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      position: relative;
      padding: 0.8rem 0.9rem 0.8rem 2rem;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.68);
      line-height: 1.62;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 0.9rem;
      top: 1.28rem;
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--accent);
    }

    .empty {
      padding: 1.2rem;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.45);
      line-height: 1.7;
    }

    .gap-card { border-left: 4px solid var(--danger); }
    .gap-card .card-kicker { color: var(--danger); }

    .timeline {
      display: grid;
      gap: 0;
      margin-left: 0.4rem;
    }

    .timeline-item {
      position: relative;
      padding: 0 0 1.2rem 1.5rem;
      border-left: 2px solid var(--line);
      line-height: 1.65;
    }

    .timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -0.42rem;
      top: 0.25rem;
      width: 0.7rem;
      height: 0.7rem;
      border: 3px solid var(--surface-strong);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .graph-shell {
      display: grid;
      gap: 1rem;
    }

    .graph-lanes {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(180px, 1fr);
      gap: 0.8rem;
      overflow-x: auto;
      padding: 0.25rem 0.1rem 0.75rem;
    }

    .graph-lane {
      position: relative;
      min-width: 180px;
      padding: 0.8rem;
      border-radius: 18px;
      background: color-mix(in srgb, var(--accent-soft) 42%, white);
    }

    .graph-lane:not(:last-child)::after {
      content: "→";
      position: absolute;
      right: -0.72rem;
      top: 50%;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      color: var(--accent-deep);
      background: var(--surface-strong);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }

    .graph-lane-title {
      margin: 0 0 0.7rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 780;
    }

    .graph-node {
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: var(--surface-strong);
      text-align: left;
      cursor: pointer;
    }

    .graph-node[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent-deep);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .graph-focus {
      padding: 1rem;
      border-radius: 16px;
      color: var(--accent-deep);
      background: var(--accent-soft);
      line-height: 1.65;
    }

    .edge-list { display: grid; gap: 0.6rem; }

    .edge {
      display: grid;
      grid-template-columns: minmax(120px, 0.75fr) auto minmax(120px, 0.75fr) minmax(220px, 1.5fr);
      gap: 0.7rem;
      align-items: center;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface-strong);
      font-size: 0.86rem;
    }

    .edge-arrow { color: var(--accent); font-weight: 800; }
    .edge-rationale { color: var(--muted); line-height: 1.5; }

    .hint-list details {
      margin-bottom: 0.65rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-strong);
    }

    .hint-list summary {
      color: var(--accent-deep);
      font-weight: 760;
      cursor: pointer;
    }

    .hint-list details > div {
      padding-top: 0.75rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .notice {
      display: none;
      margin-top: 1rem;
      padding: 1rem 1.2rem;
      border: 1px solid color-mix(in srgb, var(--danger) 35%, white);
      border-radius: 16px;
      color: #6e2626;
      background: #fff1ee;
      line-height: 1.65;
    }

    dialog {
      width: min(680px, calc(100% - 2rem));
      max-height: min(82vh, 800px);
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 24px;
      color: var(--ink);
      background: var(--surface-strong);
      box-shadow: 0 30px 90px rgba(12, 33, 24, 0.3);
    }

    dialog::backdrop { background: rgba(12, 27, 21, 0.55); backdrop-filter: blur(3px); }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 1.4rem;
      border-bottom: 1px solid var(--line);
    }

    .drawer-head h2 { margin: 0; font-size: 1.2rem; }

    .drawer-close {
      width: 2.25rem;
      height: 2.25rem;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: var(--accent-soft);
      cursor: pointer;
    }

    .drawer-body {
      max-height: calc(82vh - 75px);
      padding: 1.3rem 1.4rem 2rem;
      overflow: auto;
    }

    .detail-group {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }

    .detail-group:last-child { border-bottom: 0; }

    .detail-label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 780;
    }

    .detail-value { line-height: 1.7; overflow-wrap: anywhere; }
    .detail-value ul { margin: 0; padding-left: 1.2rem; }

    .footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .masthead-grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .workspace { grid-template-columns: 1fr; }
      .rail { position: static; }
      .tabs { grid-template-columns: repeat(3, 1fr); }
      .tab { text-align: center; }
      .rail-note { display: none; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .search { width: 100%; }
      .edge { grid-template-columns: 1fr auto 1fr; }
      .edge-rationale { grid-column: 1 / -1; }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 1rem, 1440px); }
      .masthead { min-height: 0; border-radius: 24px; }
      .metrics { margin-inline: 0.5rem; }
      .metric { min-height: 90px; padding: 0.9rem; }
      .tabs { grid-template-columns: 1fr; }
      .tab { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body data-stage="S7">
  <a class="skip-link" href="#main">跳到阶段内容</a>
  <div class="page">
    <header class="masthead">
      <div class="masthead-grid">
        <div>
          <p class="eyebrow" id="eyebrow">S1 · 目标与成功契约</p>
          <h1 id="headline">目标与成功契约</h1>
          <p class="lede" id="lede">把目标、能力、验收与边界放在同一张可核对的结果视图中。</p>
        </div>
        <section class="decision-card" aria-labelledby="decision-title">
          <p class="decision-label" id="decision-title">阶段判断</p>
          <p class="decision-value" id="verdict">—</p>
          <div class="decision-route"><span>下一步</span><strong id="route">—</strong></div>
        </section>
      </div>
      <div class="notice" id="notice" role="alert"></div>
    </header>

    <section class="metrics" aria-label="阶段概览">
      <div class="metric"><span class="metric-label">阶段状态</span><span class="metric-value" id="metric-status">—</span></div>
      <div class="metric"><span class="metric-label" id="metric-a-label">关键项目</span><span class="metric-value" id="metric-a">—</span></div>
      <div class="metric"><span class="metric-label" id="metric-b-label">待处理缺口</span><span class="metric-value" id="metric-b">—</span></div>
      <div class="metric"><span class="metric-label">结果时间</span><span class="metric-value" id="metric-date">—</span></div>
    </section>

    <main class="workspace" id="main">
      <aside class="rail" aria-label="阶段内容导航">
        <p class="rail-title">查看内容</p>
        <div class="tabs" role="tablist" id="tabs"></div>
        <p class="rail-note" id="rail-note">切换、筛选和展开只改变当前阅读视图。</p>
      </aside>

      <div class="main-column">
        <div class="toolbar">
          <div class="view-heading">
            <h2 id="view-title">阶段信息</h2>
            <p id="view-description"></p>
          </div>
          <label>
            <span class="visually-hidden">筛选当前内容</span>
            <input class="search" id="search" type="search" placeholder="筛选当前内容…" autocomplete="off">
          </label>
        </div>
        <div class="content-stack" id="content" role="tabpanel"></div>
      </div>
    </main>

    <footer class="footer" id="footer-date"></footer>
  </div>

  <dialog id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">详细信息</h2>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭详情">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </dialog>

  <script id="stage-data" type="application/json">{}</script>
  <script>
    (() => {
      "use strict";

      const EXPECTED_STAGE = "S7";
      const STAGES = {
        S1: {
          name: "目标与成功契约",
          subtitle: "把目标场景、可观察能力、终局验收、范围边界和确认结果放在同一张可核对的视图中。",
          accent: ["#1f7656", "#dceee5", "#0c4f38"],
          profile: "goal_contract_dashboard",
          tabs: [
            ["overview", "目标与范围", "查看目标场景、约束、范围和术语校正。"],
            ["capability", "能力与验收", "对照每项可观察能力、验收任务与通过规则。"],
            ["confirmation", "确认与开放问题", "查看已确认项目、遗留问题和现实边界。"]
          ]
        },
        S2: {
          name: "领域证据全景",
          subtitle: "从研究轮次走到来源、主张、共识与分歧，保留每条结论背后的证据边界。",
          accent: ["#3268a8", "#e0ebf7", "#183f72"],
          profile: "evidence_landscape_workbench",
          tabs: [

      function node(tag, className, text) {
        const item = doc.createElement(tag);
        if (className) item.className = className;
        if (text !== undefined && text !== null) item.textContent = String(text);
        return item;
      }

      function asArray(value) {
        if (value === null || value === undefined) return [];
        return Array.isArray(value) ? value : [value];
      }

      function label(key) {
        return LABELS[key] || String(key).replaceAll("_", " ");
      }

      function short(value, fallback = "尚无数据") {
        if (value === null || value === undefined || value === "") return fallback;
        if (typeof value === "string" || typeof value === "number") return String(value);
        if (typeof value === "boolean") return value ? "是" : "否";
        if (Array.isArray(value)) return value.map(v => short(v, "")).filter(Boolean).join("；") || fallback;
        const preferred = ["title", "statement", "description", "summary", "item", "outcome", "claim", "content"];
        for (const key of preferred) if (value[key]) return short(value[key], fallback);
        return Object.entries(value).slice(0, 2).map(([key, val]) => `${label(key)}：${short(val, "—")}`).join("；") || fallback;
      }

      function dateText(value) {
        if (!value) return "未记录";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        }).format(date);
      }

      function empty(text) {
        return node("div", "empty", text);
      }

      function section(title, description, body, countValue) {
        const wrap = node("section", "section");
        const head = node("div", "section-head");
        const copy = node("div");
        copy.append(node("h3", "", title));
        if (description) copy.append(node("p", "section-description", description));
        head.append(copy);
        if (countValue !== undefined) head.append(node("span", "count", `${countValue} 项`));
        wrap.append(head, body || empty("当前没有可展示的数据。"));
        return wrap;
      }

      function bullets(values, fallback) {
        const items = asArray(values).filter(v => v !== null && v !== undefined && v !== "");
        if (!items.length) return empty(fallback || "当前没有可展示的项目。");
        const list = node("ul", "bullet-list");
        items.forEach(value => list.append(node("li", "", short(value))));
        return list;
      }

      function facts(entries) {
        const grid = node("div", "fact-grid");
        entries.filter(([, value]) => value !== undefined).forEach(([name, value]) => {
          const item = node("div", "fact");
          item.append(node("span", "fact-label", name), node("span", "fact-value", short(value)));
          grid.append(item);
        });
        return grid;
      }

      function card(title, summary, detail, kicker, extraClass) {
        const item = node("article", `card${extraClass ? ` ${extraClass}` : ""}`);
        item.dataset.search = `${title} ${summary} ${short(detail, "")}`.toLowerCase();
        if (kicker) item.append(node("p", "card-kicker", kicker));
        item.append(node("h4", "", title));
        if (summary) item.append(node("p", "", summary));
        const action = node("button", "card-action", "查看详情 →");
        action.type = "button";
        action.addEventListener("click", () => openDetail(title, detail));
        item.append(action);
        return item;
      }

      function cards(values, options = {}) {
        const items = asArray(values).filter(v => v !== null && v !== undefined);
        if (!items.length) return empty(options.fallback || "当前没有可展示的项目。");
        const grid = node("div", "cards");
        items.forEach((value, index) => {
          const title = options.title ? options.title(value, index) : short(value);
          const summary = options.summary ? options.summary(value, index) : "";
          const kicker = options.kicker ? options.kicker(value, index) : `项目 ${index + 1}`;
          grid.append(card(title, summary, value, kicker, options.extraClass));
        });
        return grid;
      }

      function timeline(values, fallback) {
        const items = asArray(values).filter(Boolean);
        if (!items.length) return empty(fallback || "当前没有处理记录。");
        const wrap = node("div", "timeline");
        items.forEach(value => wrap.append(node("div", "timeline-item", short(value))));
        return wrap;
      }

      function detailValue(value) {
        if (value === null || value === undefined) return node("div", "detail-value", "未记录");
        if (typeof value !== "object") return node("div", "detail-value", short(value));
        if (Array.isArray(value)) {
          if (!value.length) return node("div", "detail-value", "无");
          const list = node("ul");
          value.forEach(item => {
            const li = node("li");
            if (typeof item === "object" && item !== null) li.append(detailObject(item));
            else li.textContent = short(item);
            list.append(li);
          });
          const wrap = node("div", "detail-value");
          wrap.append(list);
          return wrap;
        }
        return detailObject(value);
      }

      function detailObject(value) {
        const wrap = node("div", "detail-value");
        Object.entries(value).forEach(([key, val]) => {
          const group = node("div", "detail-group");

          wrap.append(group);

      function graphView(nodes, edges) {
        const wrap = node("div", "graph-shell");
        if (!nodes.length) return empty("当前没有可展示的图谱节点。");
        const hardEdges = edges.filter(edge => edge.prerequisite_strength === "hard");
        const levels = new Map(nodes.map(item => [item.node_id, 0]));
        for (let round = 0; round < nodes.length; round += 1) {
          hardEdges.forEach(edge => {
            const next = Math.max(levels.get(edge.to_node) || 0, (levels.get(edge.from_node) || 0) + 1);
            levels.set(edge.to_node, Math.min(next, 4));
          });
        }
        const groups = new Map();
        nodes.forEach(item => {
          const level = levels.get(item.node_id) || 0;
          if (!groups.has(level)) groups.set(level, []);
          groups.get(level).push(item);
        });
        const lanes = node("div", "graph-lanes");
        const edgeList = node("div", "edge-list");
        const focus = node("div", "graph-focus", "选择一个节点，可聚焦查看它的前置与后继关系。");
        let selected = null;
        const buttons = [];

        function drawEdges() {
          edgeList.replaceChildren();
          const visible = selected ? edges.filter(edge => edge.from_node === selected || edge.to_node === selected) : edges;
          if (!visible.length) edgeList.append(empty(selected ? "这个节点当前没有记录到直接关系。" : "当前没有关系边。"));
          visible.forEach(edge => {
            const row = node("div", "edge");
            row.append(
              node("strong", "", edge.from_node),
              node("span", "edge-arrow", edge.prerequisite_strength === "hard" ? "━━▶" : "┄┄▶"),
              node("strong", "", edge.to_node),
              node("span", "edge-rationale", edge.rationale || edge.prerequisite_strength)
            );
            edgeList.append(row);
          });
        }

        [...groups.entries()].sort((a, b) => a[0] - b[0]).forEach(([level, items]) => {
          const lane = node("div", "graph-lane");
          lane.append(node("p", "graph-lane-title", `关系层 ${level + 1}`));
          items.forEach(item => {
            const button = node("button", "graph-node", item.node_id);
            button.type = "button";
            button.setAttribute("aria-pressed", "false");
            button.title = item.capability_statement || item.node_id;
            button.addEventListener("click", () => {
              selected = selected === item.node_id ? null : item.node_id;
              buttons.forEach(entry => entry.setAttribute("aria-pressed", String(entry.dataset.id === selected)));
              focus.textContent = selected
                ? `${item.node_id} · ${item.capability_statement || "未记录能力描述"}`
                : "已显示全部关系；再次选择节点可聚焦浏览。";
              drawEdges();
            });
            button.dataset.id = item.node_id;
            buttons.push(button);
            lane.append(button);
          });
          lanes.append(lane);
        });
        drawEdges();
        wrap.append(lanes, focus, edgeList);
        return wrap;
      }

          section("学习单元", "学习单元用于可读分组，原子节点仍是诊断与规划真值。", cards(c.learning_units, {
            title: item => item.title || item.unit_id,
            summary: item => item.outcome || "",
            kicker: item => item.unit_id || "单元"
          }), asArray(c.learning_units).length)
        ];
        if (view === "graph") return [
          section("原子节点关系图", "列表示硬先修层次；选择节点可聚焦它的直接前置与后继关系。", graphView(asArray(c.nodes), asArray(c.edges)), asArray(c.nodes).length),
          section("节点说明", "节点保留类型、能力描述和常见误概念。", cards(c.nodes, {
            title: item => item.capability_statement || item.node_id,
            summary: item => `${short(item.node_type)} · ${asArray(item.common_misconceptions).length} 个常见误概念`,
            kicker: item => item.node_id
          })),
          section("单元—节点映射", "多对多映射说明每个单元如何覆盖核心或支撑节点。", cards(c.unit_node_mappings, {
            title: item => `${item.unit_id || "单元"} ↔ ${item.node_id || "节点"}`,
            summary: item => short(item.relationship_role || item.role || item.rationale, ""),
            kicker: () => "映射"
          }))
        ];
        return [
          section("节点测评", "每个目标节点都有可执行的识别、应用或迁移任务。", cards(c.assessment_items, {
            title: item => item.item || item.node_id,
            summary: item => `${item.node_id || ""} · ${item.cognitive_level || ""}`,
            kicker: item => item.cognitive_level || "测评"
          }), asArray(c.assessment_items).length),
          section("掌握阈值", "阈值提前声明，避免在看到结果后移动标准。", cards(c.mastery_thresholds, {
            title: item => item.node_id || "节点阈值",
            summary: item => item.threshold || "",
            kicker: item => item.requires_transfer ? "包含迁移" : "基础掌握"
          })),
          section("补救入口与追溯", "失败后返回对应节点，并保留目标和证据来源。", cards([
            ...asArray(c.remediation_entries),
            c.traceability
          ].filter(Boolean), {kicker: (_, i) => i < asArray(c.remediation_entries).length ? "补救" : "追溯"}))
        ];
      }

      function diagnosticMaterial() {
        const records = envelope.processing_record || [];
        return {
          rules: records.filter(item => /^推断规则/.test(item)),
          tasks: records.filter(item => /^任务D\d+/.test(item)),
          fields: records.filter(item => /^每项作答/.test(item)),
          other: records.filter(item => !/^推断规则|^任务D\d+|^每项作答/.test(item))
        };
      }

      function renderS4(view, c) {
        const material = diagnosticMaterial();
        if (view === "diagnosis") return [
          section("节点状态", "只有真实、多项且符合规则的行为证据才能形成节点状态。", cards(c.node_states, {
            title: item => item.node_id || short(item),
            summary: item => short(item.state || item.status || item.evidence_summary, ""),
            kicker: () => "节点诊断",
            fallback: "当前尚未形成节点状态；下面列出已经准备好的诊断任务。"
          }), asArray(c.node_states).length),
          section("诊断任务", "任务直接来自本阶段处理结果，可用于采集独立作答、迁移和置信度证据。", cards(material.tasks, {
            title: item => item.split("：")[0],
            summary: item => item.split("：").slice(1).join("："),
            kicker: () => "待执行"
          }), material.tasks.length),
          section("事前判断规则", "规则在作答前已经确定。", bullets(material.rules)),
          section("需要记录的作答字段", "这些字段用于区分独立掌握、提示依赖和修正轨迹。", bullets(material.fields))
        ];
        if (view === "frontier") return [
          section("最近学习前沿", "前沿只由已证实节点状态和先修关系推导。", cards(c.learning_frontier, {kicker: () => "学习前沿", fallback: "尚无真实作答，因此当前不能形成学习前沿。"})),
          section("误概念与能力缺口", "把错误模式、能力缺口和迁移表现分开查看。", cards([
            ...asArray(c.misconceptions),
            ...asArray(c.capability_gaps),
            ...asArray(c.transfer_performance)
          ], {kicker: (_, index) => {
            if (index < asArray(c.misconceptions).length) return "误概念";
            if (index < asArray(c.misconceptions).length + asArray(c.capability_gaps).length) return "能力缺口";
            return "迁移表现";
          }, fallback: "当前没有足够行为证据形成误概念、能力缺口或迁移判断。"})),
          gapsSection("形成学习前沿前的缺口")
        ];
        return [
          section("诊断证据", "查看节点与行为证据的映射及证据有效期。", cards([
            ...asArray(c.diagnosis_evidence_mapping),
            ...asArray(c.evidence_validity),
            ...asArray(envelope.evidence_collected)
          ], {kicker: (_, index) => index < asArray(c.diagnosis_evidence_mapping).length ? "节点证据" : "证据状态", fallback: "当前没有学习者行为证据。"})),
          section("待复测或人工确认", "证据不足、过期或存在冲突的项目保留在这里。", cards(c.items_needing_retest_or_human_confirmation, {
            kicker: () => "待复测",
            fallback: "尚未进入复测清单；需要先完成当前诊断任务。"
          })),
          confirmationSection(),
          recoverySection()
        ];
      }

      function renderS5(view, c) {
        if (view === "route") return [
          section("有序学习节点", "路线从已证实前沿出发，并保留硬先修关系。", cards(c.ordered_learning_nodes, {
            title: item => item.node_id || item.title || short(item),
            summary: item => short(item.rationale || item.goal || item.outcome, ""),
            kicker: (_, index) => `顺序 ${index + 1}`,
            fallback: "缺少通过 G4 的学习前沿，当前不能生成个性化节点路线。"
          }), asArray(c.ordered_learning_nodes).length),
          section("阶段目标", "每段路线都有可验收的阶段目标。", cards(c.stage_goals, {kicker: () => "阶段目标", fallback: "路线尚未形成，因此没有阶段目标。"})),
          gapsSection("规划前置缺口")
        ];
        if (view === "sessions") return [
          section("学习会话", "每个会话连接目标节点、活动、通关标准与时间预算。", cards(c.sessions, {
            title: item => item.title || item.session_id || short(item),
            summary: item => short(item.goal || item.outcome || item.duration, ""),
            kicker: (_, index) => `会话 ${index + 1}`,
            fallback: "前沿与路线尚未形成，因此没有可执行会话。"
          }), asArray(c.sessions).length),
          section("测评计划", "诊断、形成性检查、迁移与复测按路线安排。", cards(c.assessment_schedule, {kicker: () => "测评", fallback: "当前没有测评排期。"})),
          section("退出标准", "明确什么时候可以进入教学交互或结束当前路线。", bullets(c.exit_criteria, "当前没有可用退出标准。")),
          recoverySection()
        ];
        return [
          section("复习锚点", "复习安排与关键节点、遗忘风险和迁移任务对齐。", cards(c.review_anchors, {kicker: () => "复习", fallback: "当前没有复习锚点。"})),
          section("风险与备选路线", "风险出现时按预先声明的备选路径调整。", cards([
            ...asArray(c.risks),
            ...asArray(c.alternative_routes)
          ], {kicker: (_, index) => index < asArray(c.risks).length ? "风险" : "备选路线", fallback: "路线未形成，尚无可比较的风险与备选路线。"})),
          confirmationSection(),
          section("当前处理", "已经执行的输入校验、阻断判断和恢复条件。", timeline(envelope.processing_record))
        ];
      }

      function hintBlock(values) {
        const items = asArray(values);
        if (!items.length) return empty("当前没有可展示的提示阶梯。");
        const wrap = node("div", "hint-list");
        items.forEach((item, index) => {
          const details = node("details");
          details.append(node("summary", "", `提示 ${index + 1} · ${short(item.level || item.type || "", "逐步展开")}`));
          const body = node("div");
          body.append(detailValue(item));
          details.append(body);
          wrap.append(details);
        });
        return wrap;
      }

      function renderS6(view, c) {
        if (view === "instruction") return [
          section("当前节点与会话目标", "教学内容只围绕已确认计划中的当前节点展开。", facts([
            ["当前节点", c.current_node], ["会话目标", c.session_goal], ["成功条件", c.success_conditions]
          ])),
          section("分层解释", "解释保留来源、适用层级和关键推理。", cards(c.explanations, {kicker: () => "解释", fallback: "前置计划未通过，当前没有生成教学解释。"})),
          section("正例与反例", "正反例用于暴露边界与常见误概念。", cards(c.examples, {
            title: item => item.title || item.type || short(item),
            summary: item => short(item.explanation || item.rationale || "", ""),
            kicker: item => item.type || "案例",
            fallback: "当前没有正反例。"
          })),
          gapsSection("开展教学前的缺口")
        ];
        if (view === "activity") return [
          section("学习活动", "活动安排先独立产出，再按证据提供反馈。", cards(c.activities, {
            title: item => item.title || item.activity_id || short(item),
            summary: item => short(item.instruction || item.goal || "", ""),
            kicker: (_, index) => `活动 ${index + 1}`,
            fallback: "当前没有可执行活动。"
          })),
          section("渐进提示", "提示默认折叠，可按层级逐步查看。", hintBlock(c.hint_ladder), asArray(c.hint_ladder).length),
          section("反馈与支架渐隐", "反馈规则和支架退出条件保持可见。", cards([
            ...asArray(c.feedback_rules),
            ...asArray(c.scaffolding_fade_strategy)
          ], {kicker: (_, index) => index < asArray(c.feedback_rules).length ? "反馈" : "渐隐策略", fallback: "当前没有反馈或渐隐策略。"})),
          recoverySection()
        ];
        return [
          section("已记录交互", "这里只展示已经进入规范信封的回答、提示与修正事件。", cards(c.interaction_events, {
            title: item => item.event_id || item.type || short(item),
            summary: item => short(item.response || item.summary || item.content, ""),
            kicker: item => item.type || "交互事件",
            fallback: "当前没有真实交互事件。"
          }), asArray(c.interaction_events).length),
          section("候选掌握证据", "候选证据仍需 S7 按预设规则综合判断。", cards(c.candidate_mastery_evidence, {kicker: () => "候选证据", fallback: "尚未产生候选掌握证据。"})),
          section("内容质量", "记录内容的正确性、追溯、适配和泄露检查结论。", cards(c.content_quality_status, {kicker: () => "内容质量", fallback: "教学内容尚未生成，因此没有内容质量结论。"})),
          section("当前处理与恢复顺序", "显示已经完成的检查和下一步需要补齐的真实条件。", timeline(envelope.processing_record))
        ];
      }

      function renderS7(view, c) {
        if (view === "mastery") return [
          section("多维掌握验证", "正确性、推理、独立性、提示影响、迁移、置信度和保持证据综合呈现。", cards(c.mastery_verification, {
            title: item => item.node_id || item.dimension || short(item),
            summary: item => short(item.decision || item.status || item.evidence_summary, ""),
            kicker: () => "掌握验证",
            fallback: "缺少通过 G6 的真实证据，当前不能形成掌握判断。"
          })),
          section("阶段证据", "保留证据来源与充分性，不用单次或模拟结果替代。", cards(envelope.evidence_collected, {kicker: item => item.provenance || "证据", fallback: "当前没有可用于掌握验证的行为证据。"})),
          gapsSection("形成掌握结论前的缺口")
        ];
        if (view === "model") return [
          section("学习者模型差异", "模型更新必须能追溯到掌握验证，并通过版本检查。", cards(c.learner_model_update_and_replan, {
            title: item => item.node_id || item.change_type || short(item),
            summary: item => short(item.reason || item.update_status || item.patch, ""),
            kicker: () => "模型变更",
            fallback: "掌握验证未形成，当前没有模型更新结果。"
          })),
          section("版本与事务条件", "显示当前恢复模型更新所需的版本和持久化条件。", timeline(envelope.processing_record)),
          recoverySection()
        ];
        return [
          section("下一路由", "建议路线与已执行状态分开呈现。", cards(c.route, {kicker: () => "路由结果", fallback: `当前路由：${envelope.quality_evaluation?.route_to || "未确定"}`})),
          section("复测、复习与重规划", "根据归因选择同节点补救、返回上游、延迟复测或进入下一节点。", cards(c.learner_model_update_and_replan?.replan || c.learner_model_update_and_replan, {
            kicker: () => "重规划",
            fallback: "证据不足，尚未生成复测或重规划方案。"
          })),
          section("来源反馈", "来源错误、过期、覆盖缺口或新兴信号误用只生成反馈并返回 S2，不在 S7 改写事实。", cards(
            c.learner_model_update_and_replan?.evidence_feedback,
            {kicker: item => item.type || "来源反馈", fallback: "本轮没有发现需要返回 S2 的来源异常。"}
          )),
          section("适用限制", "说明结论适用于哪些节点、证据时段与使用场景。", bullets(c.applicability_limits, "当前没有形成可适用的掌握结论。")),
          confirmationSection()
        ];
      }

      function renderCurrent() {
        const c = envelope.positive_artifact?.content || {};
        const renderers = {S1: renderS1, S2: renderS2, S3: renderS3, S4: renderS4, S5: renderS5, S6: renderS6, S7: renderS7};
        const items = renderers[EXPECTED_STAGE](activeTab, c);
        contentRoot.replaceChildren(...items);
        search.value = "";
        applySearch();
      }

      function applySearch() {
        const query = search.value.trim().toLowerCase();
        contentRoot.querySelectorAll("[data-search]").forEach(item => {
          item.hidden = Boolean(query) && !item.dataset.search.includes(query);
        });
      }

      function activateTab(index, focus = false) {
        activeTab = config.tabs[index][0];
        const tabs = [...doc.querySelectorAll(".tab")];
        tabs.forEach((tab, tabIndex) => {
          const selected = tabIndex === index;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        contentRoot.setAttribute("aria-labelledby", tabs[index].id);
        doc.getElementById("view-title").textContent = config.tabs[index][1];
        doc.getElementById("view-description").textContent = config.tabs[index][2];
        renderCurrent();
        if (focus) tabs[index].focus();
      }

      function setupTabs() {
        const tabsRoot = doc.getElementById("tabs");
        config.tabs.forEach((entry, index) => {
          const button = node("button", "tab", entry[1]);
          button.type = "button";
          button.role = "tab";
          button.id = `stage-tab-${index}`;
          button.setAttribute("aria-controls", "content");
          button.addEventListener("click", () => activateTab(index));
          button.addEventListener("keydown", event => {
            if (!["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft", "Home", "End"].includes(event.key)) return;
            event.preventDefault();
            let next = index;
            if (event.key === "Home") next = 0;
            else if (event.key === "End") next = config.tabs.length - 1;
            else if (["ArrowDown", "ArrowRight"].includes(event.key)) next = (index + 1) % config.tabs.length;
            else next = (index - 1 + config.tabs.length) % config.tabs.length;
            activateTab(next, true);
          });
          tabsRoot.append(button);
        });
      }

      function metricCount(c) {
        const counts = {
          S1: ["可观察能力", asArray(c.observable_capabilities).length],
          S2: ["来源与主张", asArray(c.source_ledger).length + asArray(c.claims).length],
          S3: ["原子节点", asArray(c.nodes).length],
          S4: ["诊断任务", diagnosticMaterial().tasks.length || asArray(c.node_states).length],
          S5: ["规划会话", asArray(c.sessions).length],
          S6: ["交互事件", asArray(c.interaction_events).length],
          S7: ["掌握判断", asArray(c.mastery_verification).length]
        };
        return counts[EXPECTED_STAGE];
      }

      function initializePage() {
        config = STAGES[EXPECTED_STAGE];
        const reportedProfile = envelope.presentation_artifact?.view_profile;
        if (envelope.stage_id !== EXPECTED_STAGE || (reportedProfile && reportedProfile !== config.profile)) {
          throw new Error("内嵌结果与当前阶段不匹配。");
        }
        const [accent, soft, deep] = config.accent;
        doc.documentElement.style.setProperty("--accent", accent);
        doc.documentElement.style.setProperty("--accent-soft", soft);
        doc.documentElement.style.setProperty("--accent-deep", deep);
        doc.title = `${EXPECTED_STAGE} · ${config.name}`;
        doc.getElementById("eyebrow").textContent = `${EXPECTED_STAGE} · ${config.name}`;
        doc.getElementById("lede").textContent = config.subtitle;
        const c = envelope.positive_artifact?.content || {};
        const headlineCandidates = {
          S1: c.target_problem,
          S2: c.scope,
          S3: c.focus_question,
          S4: c.learning_frontier?.[0]?.statement,
          S5: c.stage_goals?.[0]?.statement,
          S6: c.session_goal,
          S7: c.mastery_verification?.summary
        };
        doc.getElementById("headline").textContent = short(
          headlineCandidates[EXPECTED_STAGE],
          envelope.status === "completed" ? config.name : `${config.name} · ${STATUS[envelope.status] || envelope.status}`
        );
        const verdict = envelope.quality_evaluation?.verdict;
        doc.getElementById("verdict").textContent = STATUS[verdict] || verdict || "尚未判断";
        doc.getElementById("route").textContent = envelope.quality_evaluation?.route_to || "—";
        doc.getElementById("metric-status").textContent = STATUS[envelope.status] || envelope.status;
        const [metricName, metricValue] = metricCount(c);
        doc.getElementById("metric-a-label").textContent = metricName;
        doc.getElementById("metric-a").textContent = String(metricValue);
        doc.getElementById("metric-b").textContent = String(asArray(envelope.requirement_gaps).length);
        doc.getElementById("metric-date").textContent = dateText(envelope.created_at).split(" ")[0];
        doc.getElementById("footer-date").textContent = `阶段结果时间：${dateText(envelope.created_at)}`;
        setupTabs();
        activateTab(0);
      }

      doc.getElementById("drawer-close").addEventListener("click", () => drawer.close());
      drawer.addEventListener("click", event => {
        if (event.target === drawer) drawer.close();
      });
      search.addEventListener("input", applySearch);

      try {
        const raw = doc.getElementById("stage-data").textContent;
        envelope = JSON.parse(raw);
        initializePage();
      } catch (error) {
        const notice = doc.getElementById("notice");
        notice.style.display = "block";
        notice.textContent = `页面数据暂时无法显示：${error.message}`;
        doc.getElementById("headline").textContent = "阶段结果暂时无法显示";
        doc.getElementById("lede").textContent = "请使用本次运行产出的完整页面文件重新打开。";
        doc.querySelector(".workspace").hidden = true;
        doc.querySelector(".metrics").hidden = true;
      }
    })();
  </script>
</body>
</html>
